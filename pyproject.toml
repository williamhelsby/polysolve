[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polysolve"
authors = [{name = "William Helsby", email = "william.helsby@stfc.ac.uk"}]
requires-python = ">= 3.8"
readme = "README.md"
description = ""
license = {text = "BSD-3-Clause"}

keywords = [""]
dependencies = ["numpy"]
classifiers = [""]
dynamic = ["version"]

[project.urls]
Homepage="https://github.com/williamhelsby/polysolve"
Repository="https://github.com/williamhelsby/polysolve.git"

[tool.setuptools.dynamic]
version = {attr = "polysolve.__version__"}
